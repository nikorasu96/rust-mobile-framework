[workspace]
members = [
    "crates/rmf-core",
    "crates/rmf-reconciliation",
    "crates/rmf-runtime",
    "adapters/rmf-renderer-headless",
    "benchmarks/rmf-bench",
    "examples/hello-headless",
]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
