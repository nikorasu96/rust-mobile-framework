name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo +1.85.0 fmt --all --check
      - name: Clippy
        run: cargo +1.85.0 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +1.85.0 test --workspace --all-targets --all-features --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.85.0 doc --workspace --no-deps --locked
      - name: Architecture and contract regressions
        run: |
          python3 scripts/check_architecture.py
          python3 -m unittest discover -s scripts/tests
      - name: Release performance gate
        run: cargo +1.85.0 run --release --locked -p rmf-bench
